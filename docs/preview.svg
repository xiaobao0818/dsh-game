<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="One short sentence on the left turns into a playable game screen on the right">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b33"/>
      <stop offset="1" stop-color="#2a1840"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#241a38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f2a33c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff0ff"/>
      <stop offset="1" stop-color="#3f7ea8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" fill="url(#bg)"/>
  <!-- left: one-sentence brief -->
  <rect x="34" y="60" width="196" height="180" rx="18" fill="#1c2442" stroke="#3a3f68" stroke-width="2"/>
  <rect x="54" y="84" width="96" height="12" rx="6" fill="url(#gold)" opacity="0.9"/>
  <rect x="54" y="108" width="150" height="8" rx="4" fill="#6f789c"/>
  <rect x="54" y="124" width="126" height="8" rx="4" fill="#6f789c"/>
  <rect x="54" y="140" width="140" height="8" rx="4" fill="#535c80"/>
  <rect x="54" y="168" width="64" height="22" rx="11" fill="url(#cyan)" opacity="0.85"/>
  <rect x="128" y="168" width="52" height="22" rx="11" fill="#3b4470"/>
  <!-- arrow / transformation -->
  <path d="M248 150h44" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M286 136l16 14-16 14" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(292 104) scale(0.9)">
    <path d="M0 -18l4.4 10.6 10.6 4.4-10.6 4.4L0 12l-4.4-10.6L-15 0l10.6-4.4z" fill="url(#gold)"/>
  </g>
  <!-- right: playable game screen -->
  <rect x="318" y="36" width="288" height="228" rx="18" fill="url(#stage)" stroke="#45507e" stroke-width="2"/>
  <!-- sky moon -->
  <circle cx="556" cy="76" r="18" fill="#fff3c4" opacity="0.9"/>
  <circle cx="548" cy="72" r="16" fill="#1a2140"/>
  <!-- ground -->
  <rect x="318" y="206" width="288" height="58" fill="#33243a"/>
  <path d="M318 206h288" stroke="#a581d6" stroke-width="1.5" opacity="0.35"/>
  <!-- base gate -->
  <path d="M336 206v-36l18-14 18 14v36z" fill="#6d4a77"/>
  <path d="M330 172l24-20 24 20" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
  <rect x="348" y="184" width="12" height="22" fill="#2a1c33"/>
  <!-- units -->
  <g transform="translate(386 206)">
    <ellipse cx="0" cy="2" rx="13" ry="4" fill="#000" opacity="0.28"/>
    <rect x="-7" y="-26" width="14" height="20" rx="6" fill="url(#cyan)"/>
    <circle cx="0" cy="-33" r="8" fill="#f6d3aa"/>
    <path d="M8 -18l12 -8" stroke="#ff7a59" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(424 208)">
    <ellipse cx="0" cy="2" rx="12" ry="4" fill="#000" opacity="0.28"/>
    <rect x="-6" y="-24" width="12" height="18" rx="5" fill="#7fb7d6"/>
    <circle cx="0" cy="-30" r="7" fill="#f6d3aa"/>
    <path d="M-8 -16l-12 -6" stroke="#ffd76a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- enemies -->
  <g transform="translate(556 206)">
    <ellipse cx="0" cy="2" rx="14" ry="4" fill="#000" opacity="0.28"/>
    <rect x="-8" y="-28" width="16" height="22" rx="6" fill="#c85a6a"/>
    <circle cx="0" cy="-36" r="9" fill="#6f2436"/>
    <circle cx="-3" cy="-37" r="2" fill="#ffd76a"/>
  </g>
  <g transform="translate(522 206)">
    <ellipse cx="0" cy="2" rx="12" ry="4" fill="#000" opacity="0.28"/>
    <rect x="-7" y="-24" width="14" height="18" rx="5" fill="#a8485a"/>
    <circle cx="0" cy="-31" r="8" fill="#6f2436"/>
  </g>
  <!-- hp bar -->
  <rect x="330" y="216" width="64" height="6" rx="3" fill="#0b0f1c" opacity="0.7"/>
  <rect x="330" y="216" width="46" height="6" rx="3" fill="#62d68f"/>
  <!-- HUD chips -->
  <rect x="334" y="50" width="62" height="20" rx="10" fill="#0b0f1c" opacity="0.6"/>
  <circle cx="346" cy="60" r="7" fill="url(#gold)"/>
  <rect x="358" y="57" width="28" height="6" rx="3" fill="#ffd76a"/>
  <rect x="466" y="50" width="124" height="20" rx="10" fill="#0b0f1c" opacity="0.6"/>
  <rect x="478" y="57" width="66" height="6" rx="3" fill="#cfd6ff"/>
  <rect x="552" y="57" width="26" height="6" rx="3" fill="#8f96b8"/>
  <!-- star row (result hint) -->
  <g transform="translate(492 246) scale(0.55)">
    <path d="M0 -14l4.1 8.4 9.3 1.3-6.7 6.5 1.6 9.2-8.3-4.4-8.3 4.4 1.6-9.2-6.7-6.5 9.3-1.3z" fill="url(#gold)"/>
  </g>
  <g transform="translate(518 246) scale(0.55)">
    <path d="M0 -14l4.1 8.4 9.3 1.3-6.7 6.5 1.6 9.2-8.3-4.4-8.3 4.4 1.6-9.2-6.7-6.5 9.3-1.3z" fill="url(#gold)"/>
  </g>
  <g transform="translate(544 246) scale(0.55)">
    <path d="M0 -14l4.1 8.4 9.3 1.3-6.7 6.5 1.6 9.2-8.3-4.4-8.3 4.4 1.6-9.2-6.7-6.5 9.3-1.3z" fill="#5b6487"/>
  </g>
</svg>
